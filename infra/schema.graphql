# Reference copy of the schema deployed inline in template.yaml. Keep the two in sync.
#
# Who can call what:
#   - No auth directive  -> only signed-in, verified UCLA students (Cognito, the default).
#   - @aws_api_key @aws_cognito_user_pools -> signed-out visitors (API key) can call it too.

scalar AWSDateTime

type Event @aws_api_key @aws_cognito_user_pools {
  id: ID!
  title: String!
  time: String!
  clock: String!
  startsAt: AWSDateTime
  location: String!
  distance: String
  category: String!
  description: String!
  imageKey: String
  people: Int!
  source: String!
  createdAt: AWSDateTime!
}

type EventConnection @aws_api_key @aws_cognito_user_pools {
  items: [Event!]!
  nextToken: String
}

type HillAnswer {
  answer: String!
  eventIds: [ID!]!
}

type FlyerUpload {
  uploadUrl: AWSURL!
  objectKey: String!
  expiresIn: Int!
}

input CreateHangoutInput {
  title: String!
  time: String!
  clock: String!
  startsAt: AWSDateTime
  location: String!
  category: String!
  description: String
}

# The user ID comes from the sign-in token, not from the request.
input PreferencesInput {
  interests: [String!]!
  alertsEnabled: Boolean!
}

type PreferenceResult {
  userId: ID!
  interests: [String!]!
  alertsEnabled: Boolean!
  updatedAt: AWSDateTime!
}

type Query {
  listEvents(category: String, limit: Int, nextToken: String): EventConnection! @aws_api_key @aws_cognito_user_pools
  getEvent(id: ID!): Event @aws_api_key @aws_cognito_user_pools
  askHill(message: String!): HillAnswer!
}

type Mutation {
  createHangout(input: CreateHangoutInput!): Event!
  createFlyerUpload(fileName: String!, contentType: String!): FlyerUpload!
  updatePreferences(input: PreferencesInput!): PreferenceResult!
}

type Subscription {
  onEventCreated: Event
    @aws_subscribe(mutations: ["createHangout"])
    @aws_api_key @aws_cognito_user_pools
}
